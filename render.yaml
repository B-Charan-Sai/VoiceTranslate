services:
  - type: web
    name: voxtranslate-ai
    env: python
    plan: free
    region: oregon
    buildCommand: "cd 'voice Translation/voice Translation' && pip install -r requirements.txt"
    startCommand: "cd 'voice Translation/voice Translation' && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5

